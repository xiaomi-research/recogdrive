_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: False
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
vlm_hidden_size: null
train_backbone: false
training_target: 'waypoint'
flow_noise_level: 0.7
flow_sde_type: 'sde'
grpo: False
grpo_num_iterations: 1
grpo_clip_eps: 0.2
grpo_kl_coef: 0.0
grpo_bc_coeff: 0.1
grpo_sample_time: 8
optimizer_type: adamw
lr: 1e-4
cameras: null  # cam_type=multi: views fed to the VLM, default every surround view the data source has
front_short_side: 960  # cam_type=multi: front view rescaled to this short side
side_short_side: 480  # cam_type=multi: other views
vlm_max_length: null  # padded prompt length; null: 2800 single view, 8704 multi-view
action_norm_min: null  # (x, y, heading) range mapped to [-1, 1]; null: NAVSIM 4 s statistics
action_norm_max: null
lora_rank: 0  # >0: LoRA adapters on the frozen VLM (train_backbone must stay false)
lora_alpha: 16.0
lora_dropout: 0.05
lora_targets: null  # null: the language model's q/k/v/o and gate/up/down projections
