hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: ego_status_mlp_agent
  - _self_

split: trainval
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache_transfuser
use_cache_without_dataset: false # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: true
waymoe2e: false
waymoe2e_train_split: training
waymoe2e_val_split: val
seed: 0
data_loader: null  # registered loader: navsim | waymoe2e | nuscenes | mixture; null: navsim, or waymoe2e when waymoe2e=true
nuscenes:
  root: null  # directory holding samples/ and v1.0-*/
  version: v1.0-mini
mixture: []  # data_loader=mixture: [{loader: navsim, weight: 1.0}, {loader: waymoe2e, weight: 0.5, overrides: {cache_path: ...}}]
plugins: []  # modules imported at startup that register more loaders / evaluators
augment:  # training split only; everything off by default
  history_dropout: 0.0  # probability of zeroing the ego history (prompt and planner input)
  ego_status_dropout: 0.0  # probability of zeroing ego velocity and acceleration; the command stays
  color_jitter: {p: 0.0, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}
  grayscale_p: 0.0
  blur_p: 0.0
monitor:
  wandb: disabled  # disabled | online | offline; metrics.csv and loss_curve.png are always written
  project: recogdrive
infer:  # run_recogdrive_infer.py
  checkpoint: null
  data_loader: null  # null: data_loader
  split: val  # train | val | test (NAVSIM: every scene of train_test_split)
  visualize: 0  # draw the first N samples to <output_dir>/vis
max_steps: 0
skip_validation: false

train:
  strategy: fsdp  # fsdp | ddp
  precision: bf16  # compute dtype: bf16 | fp32. fsdp keeps fp32 master shards; ddp bf16 keeps bf16 weights and needs Muon (fp32 masters)
  reshard_after_forward: false  # false: fastest; true: least memory, re-gathers in backward
  hsdp_shard_size: null  # multi-node: GPUs per node, shards within a node and replicates across nodes
  fsdp_wrap_modules: []  # block class names; empty: repeated blocks and HF _no_split_modules
  replicate_frozen: [backbone]  # frozen params under these module paths stay whole on every rank
  prefetch_distance: 1
  compile: true
  activation_checkpointing: []  # module class names recomputed in backward
  activation_checkpointing_layers: null  # recompute only the first N of them (null: all); fewer is faster, uses more memory
  log_every: 10
  save_every_n_steps: 0
  resume: false
  async_save: true
  top_k: 5
  ema_decay: 0.0  # e.g. 0.999: validate, export (*-EMA.ckpt) and evaluate the moving average of trainable weights
  ema_reference_batch: 128  # global batch ema_decay is tuned for; other batch sizes use decay ** (batch / 128)

evaluator:
  name: null  # navsim | nuscenes | waymoe2e | drivelm | lingoqa | drivebench, or a list; evaluator.<name> overrides the shared keys
  every_n_epochs: 0  # 0: only the final checkpoint
  on_end: true
  split: navtest  # navsim: navtest, or on NAVSIM 2.0 navhard_two_stage / navsafe_two_stage (two-stage EPDMS)
  metric_cache_path: null
  gpus: null  # CUDA_VISIBLE_DEVICES of the eval job; during training point it at GPUs training does not use
  nproc: null
  split_overrides: []  # hydra overrides on train_test_split for the scored scenes, e.g. a scene_filter subset for fast periodic evaluation
  overrides: []  # extra overrides of the scoring entry, e.g. worker settings
  vqa:  # drivelm / lingoqa / drivebench, run by python -m recogdrive.eval.vqa
    data: null  # DriveLM / DriveBench question json, LingoQA val.parquet
    image_root: null
    judge: wayveai/Lingo-Judge  # LingoQA
    corruption: ''  # DriveBench, e.g. Fog or NoImage
    gpt: false  # DriveBench GPT score, reads OPENAI_API_KEY
    batch_size: null
    backend: turbomind  # lmdeploy engine: turbomind (reported numbers) | pytorch
  nuscenes:  # open-loop L2 / collision (ST-P3 and UniAD), in-process on the nuscenes val split
    data_overrides: {}  # config overrides for the data source, e.g. {nuscenes: {version: v1.0-trainval}}
  waymoe2e:  # WOD-E2E RFS / ADE, in-process on the waymoe2e val split (RFS needs a 5 s trajectory_sampling)
    data_overrides: {}

dataloader:
  params:
    batch_size: 16  # number of samples per batch
    num_workers: 8  # number of workers for data loading
    pin_memory: true  # pin memory for faster GPU transfer
    prefetch_factor: 2  # number of samples loaded in advance by each worker

trainer:
  params:
    max_epochs: 100  # maximum number of training epochs
    check_val_every_n_epoch: 1  # run validation set every n training epochs
    val_check_interval: 1.0  # [%] run validation set every X% of training set

    limit_train_batches: 1.0  # how much of training dataset to check (float = fraction, int = num_batches)
    limit_val_batches: 1.0  # how much of validation dataset to check (float = fraction, int = num_batches)

    accelerator: gpu  # distribution method

    strategy: ddp
    precision: 16-mixed  # floating point precision
    num_nodes: 1  # Number of nodes used for training
    devices: 8
    num_sanity_val_steps: 0  # number of validation steps to run before training begins
    fast_dev_run: false  # runs 1 batch of train/val/test for sanity

    accumulate_grad_batches: 1  # accumulates gradients every n batches
    # track_grad_norm: -1  # logs the p-norm for inspection
    gradient_clip_val: 1.0  # value to clip gradients
    gradient_clip_algorithm: norm  # [value, norm] method to clip gradients
    default_root_dir: ${output_dir}
